<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a853;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0d78c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b08a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0293a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4757;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- FKG Text -->
  <text x="30" y="145" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="130" fill="url(#goldGrad)" letter-spacing="-2" filter="url(#glow)">FKG</text>
  <!-- LIVE Text -->
  <text x="295" y="145" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="130" fill="#ffffff" letter-spacing="-2" filter="url(#glow)">LIVE</text>
  <!-- Underline accent -->
  <rect x="30" y="158" width="540" height="4" rx="2" fill="url(#redGrad)"/>
  <!-- Studios text -->
  <text x="300" y="185" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="22" fill="#d4a853" letter-spacing="18" text-anchor="middle" opacity="0.9">ENTERTAINMENT</text>
</svg>